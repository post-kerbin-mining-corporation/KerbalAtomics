    // PARTS
    #LOC_KerbalAtomics_ntr-sc-375-1_title = NV-DC “斯库拉” 核动力翼身融合火箭
    #LOC_KerbalAtomics_ntr-sc-375-1_description = 专为运载火箭级设计，这款精心打造的六芯核动力火箭是中程核推进设计的杰作。在理想情况下，发动机在发射时会注入液氧，大幅提升推力。一旦氧化剂耗尽，飞行器应已进入推力需求较低的阶段，此时即可切换为纯氢推进。在轨运行时，反应堆的低功率模式可提供最高 10 kW 的电力。翼身融合喷管可在多种高度下高效运行。哦对了，发射场周围最好清空很远的范围。
    #LOC_KerbalAtomics_ntr-sc-375-1_description_NFE = 专为运载火箭级设计，这款精心打造的六芯核动力火箭是中程核推进设计的杰作。在理想情况下，发动机在发射时会注入液氧，大幅提升推力。一旦氧化剂耗尽，飞行器应已进入推力需求较低的阶段，此时即可切换为纯氢推进。在轨运行时，反应堆的低功率模式可提供最高 50 kW 的电力。翼身融合喷管可在多种高度下高效运行。哦对了，发射场周围最好清空很远的范围。
    #LOC_KerbalAtomics_ntr-sc-375-1_tags = active atom efficient engine inter liquid nuclear nuke launch propuls radio reactor kerbalatomics bimodal aero spike scylla

    #LOC_KerbalAtomics_ntr-gc-25-1_title = NV-GE “解放者” 核动力火箭发动机
    #LOC_KerbalAtomics_ntr-gc-25-1_description = 通过将反应堆核心加热至惊人的 6000 K（并将其变为放射性气体），“解放者”将为氢燃料中的原子赋予极大的自由度，使它们迅速逃离反应堆，从而产生卓越的推力与比冲。由于此时反应堆处于“高能态”，必须小心防止核心物质本身逃逸。
    #LOC_KerbalAtomics_ntr-gc-25-1_tags =  active atom efficient engine inter liquid nuclear nuke orbit propuls radio reactor vacuum kerbalatomics gas liberator
    #LOC_KerbalAtomics_ntr-gc-25-2_title = NV-GX “解放者” 开放式核动力火箭发动机
    #LOC_KerbalAtomics_ntr-gc-25-2_description = 长久以来，核动力发动机行业一直认为反应堆核心内容物理应被限制在反应堆内部。我们说——不再如此！氢燃料与铀应享有平等的自由！反应堆的高温促使采用开放式循环涡轮泵设计，将过热的废气从发动机两侧排出，还可用于姿态滚转控制。
    #LOC_KerbalAtomics_ntr-gc-25-2_tags =   active atom efficient engine inter liquid nuclear nuke orbit propuls radio reactor vacuum kerbalatomics gas open radioa unsafe moar emancipator
    #LOC_KerbalAtomics_ntr-gc-25-3_title = NV-GL “拯救者” 核动力翼身融合火箭
    #LOC_KerbalAtomics_ntr-gc-25-3_description = 少数由极度疯狂的工程师设计、用于大气层内运行的核动力发动机之一。这款先进的气芯火箭采用八个“灯泡”模块围绕塞式翼身融合喷管布置，可在所有高度下高效工作。改进后的涡轮泵流量大幅提升了推力，但推进剂加热效率下降，比冲较其他气芯火箭损失约 30%。
    #LOC_KerbalAtomics_ntr-gc-25-3_tags = active atom efficient engine inter liquid nuclear nuke launch spike lightbulb propuls radio reactor kerbalatomics gas deliverance
    #LOC_KerbalAtomics_ntr-sc-25-1_title = NV-500 “波塞冬” 三模式核动力火箭发动机
    #LOC_KerbalAtomics_ntr-sc-25-1_description = 大型固芯核反应堆与同样大型的扩张喷管相结合，将推进剂加热至极高温度。利用二次冷却回路，部分反应堆热量可驱动小型发电机，即使发动机空闲时也能产生约 10 kW 的电力。“波塞冬”还可通过向推进剂中注入氧气来增强推力，形成巨大的火焰喷流与对应的推力提升。Post Kerbin 对此类操作不承担任何责任。
    #LOC_KerbalAtomics_ntr-sc-25-1_description_NFE = 大型核反应堆与同样大型的扩张喷管相结合，将推进剂加热至极高温度。利用二次冷却回路，部分反应堆热量可驱动小型发电机，即使发动机空闲时也能产生约 100 kW 的电力。“波塞冬”还可通过向推进剂中注入氧气来增强推力，形成巨大的火焰喷流与对应的推力提升。Post-Terran 对此类操作不承担任何责任。
    #LOC_KerbalAtomics_ntr-sc-25-1_tags = active atom efficient engine inter liquid nuclear nuke orbit propuls radio reactor vacuum kerbalatomics trimodal poseidon


    #LOC_KerbalAtomics_ntr-sc-125-1_title = NV-100 “海王星” 三模式核动力火箭发动机
    #LOC_KerbalAtomics_ntr-sc-125-1_description = 在开创性的 LV-N 基础上改进，“海王星”利用反应堆产生的多余热量驱动紧凑型发电系统，在发动机运行或空闲时可产生 2 kW 电力。发动机还具备第三种模式（因此得名），即向尾气中注入氧化剂，实现瞬时燃烧并带来强烈加速。
    #LOC_KerbalAtomics_ntr-sc-125-1_description_NFE = 在开创性的 LV-N 基础上改进，“海王星”利用反应堆产生的多余热量驱动紧凑型发电系统，在发动机运行或空闲时可产生 20 kW 电力。发动机还具备第三种模式（因此得名），即向尾气中注入氧化剂，实现瞬时燃烧并带来强烈加速。
    #LOC_KerbalAtomics_ntr-sc-125-1_tags = active atom efficient engine inter liquid nuclear nuke orbit propuls radio reactor vacuum kerbalatomics trimodal neptune
    #LOC_KerbalAtomics_ntr-sc-125-2_title = NV-50 “短柄” 增强型核动力火箭发动机
    #LOC_KerbalAtomics_ntr-sc-125-2_description = 该发动机的燃料元件被制成球形，并分布于反应堆内的圆柱鼓中。这种设计可将燃料加热至高于传统固芯设计的温度，并在运行时发出类似混凝土搅拌机的低沉轰鸣声。“短柄”针对高推力进行了优化，相较大多数其他固芯核动力火箭具备更小的体积和更高的推重比，但牺牲了比冲。它还可以通过向尾气中注入氧气来进一步增强推力，产生壮观的燃烧效果。
    #LOC_KerbalAtomics_ntr-sc-125-2_tags =  active atom efficient engine inter liquid nuclear nuke orbit propuls radio reactor vacuum pebble kerbalatomics bimodal stubber

    #LOC_KerbalAtomics_ntr-sc-0625-1_title = NV-10 “鳗鱼” 核动力火箭发动机
    #LOC_KerbalAtomics_ntr-sc-0625-1_description = “鳗鱼”核心的模块化卵石床反应堆轻巧高效，其可伸展喷管使其外形修长如同同名生物。发动机内置的小型斯特林发电机在运行时可提供惊人的 500 W 电力，足够驱动一些小型探测器。
    #LOC_KerbalAtomics_ntr-sc-0625-1_description_NFE = “鳗鱼”核心的模块化卵石床反应堆轻巧高效，其可伸展喷管使其外形修长如同同名生物。发动机内置的小型斯特林发电机在运行时可提供惊人的 2 kW 电力，足够驱动一些小型探测器。
    #LOC_KerbalAtomics_ntr-sc-0625-1_tags = active atom efficient engine inter liquid nuclear nuke orbit propuls radio reactor vacuum pebble kerbalatomics trimodal eel
